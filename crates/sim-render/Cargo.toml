[package]
name = "sim-render"
description = "wgpu render graph, PBR glTF pipeline, Hillaire atmosphere and volumetric cloud WGSL"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
glam.workspace = true
jpeg-decoder = { version = "0.3", default-features = false }
naga = { version = "24", features = ["wgsl-in"] }
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sim-geo = { path = "../sim-geo" }
sim-cfg = { path = "../sim-cfg" }
sim-atmosphere = { path = "../sim-atmosphere" }
sim-avionics = { path = "../sim-avionics" }
wgpu.workspace = true
winit.workspace = true

# winit's wayland backend pulls wayland-sys in eager-link mode, whose
# build script shells out to pkg-config for libwayland (no system
# package toolchain exists in this environment). Enable `dlopen` so the
# build script skips pkg-config entirely and the shared library is only
# loaded at runtime — the sandbox has no display server either, so the
# wayland code path never actually dlopens during tests.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "android"))))'.dependencies]
wayland-sys = { version = "0.31", features = ["dlopen"] }
