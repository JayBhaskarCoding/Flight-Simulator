// ===========================================================================
// OpenMSFS clean-room reference aircraft: Cessna 172S Skyhawk — systems
// ---------------------------------------------------------------------------
// ORIGINAL clean-room file written from public data:
//  * Cessna 172S POH electrical description (24 V battery, 60 A alternator)
//  * POH brake and vacuum system description
// No proprietary Microsoft/Asobo configuration data is used.
// ===========================================================================

[ELECTRICAL]
battery_voltage_v = 24               // two 12 V batteries in series (POH: 24 V system)
battery_capacity_ah = 13.5           // typical aviation battery (ESTIMATED)
alternator_voltage_v = 28            // regulated bus voltage (POH)
alternator_max_amps = 60             // (POH)
cruise_bus_load_amps = 18            // avionics + lights + instruments (ESTIMATED)

[BRAKES]
max_pressure_psi = 900               // hydraulic toe-brake system (ESTIMATED)
differential_toe_brakes = 1          // independent left/right wheel braking
parking_brake = 1                    // cabin parking brake lever (POH)

[FLIGHT_CONTROLS]
elevator_max_deflection_deg = 22     // ESTIMATED from hinge-moment sizing
aileron_max_deflection_deg = 18      // ESTIMATED
rudder_max_deflection_deg = 24       // ESTIMATED
control_lag_s = 0.25                 // first-order cable/actuator lag (ESTIMATED)
control_reference_kias = 75          // speed for full manual authority (ESTIMATED)

[VACUUM]
regulated_inhg = 5.2                 // vacuum regulator set point (POH range)
minimum_inhg = 3.8                   // instrument minimum (POH range)
backup_gyro = 1                      // electric standby attitude indicator
