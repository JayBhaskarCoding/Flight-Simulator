// ===========================================================================
// OpenMSFS clean-room reference aircraft: Cessna 172S Skyhawk
// ---------------------------------------------------------------------------
// This file is an ORIGINAL work written from publicly available data:
//  * Cessna 172S Pilot's Operating Handbook (public performance numbers)
//  * FAA type certificate data sheet (dimensions, weights)
//  * Published performance summaries (V-speeds, ceiling, rates)
// No Microsoft/Asobo SDK content, decompiled data, or proprietary tables
// are used or referenced. Numeric coefficients marked ESTIMATED were
// derived from standard stability-derivative estimation methods
// (perkins & Hage / Raymer) against the public geometry.
//
// Dialect: MSFS-style cfg (// comments, [SECTION] headers, key = value).
// Units: imperial as in the MSFS config dialect (ft, ft2, lb, gal, deg).
// ===========================================================================

[AIRPLANE_GEOMETRY]
wing_area = 174.0                    // ft^2, both wings (POH)
wing_span = 36.1                     // ft (POH)
wing_root_chord = 5.50               // ft (equivalent trapezoid)
wing_tip_chord = 4.15                // ft (taper chosen to integrate to wing_area)
wing_quarter_chord_sweep = 0.0       // deg, essentially straight wing
wing_dihedral = 1.73                 // deg (FAA type certificate)
wing_incidence = 1.5                 // deg at root
wing_twist = -3.0                    // deg washout root -> tip
wing_position = -1.5, 0.0, -0.5      // ft, root quarter-chord in body axes (x fwd, y right, z down)

htail_area = 21.4                    // ft^2 (estimated from three-view)
htail_span = 11.0                    // ft
htail_root_chord = 2.60              // ft
htail_tip_chord = 1.30               // ft
htail_quarter_chord_sweep = 0.0      // deg
htail_dihedral = 0.0                 // deg
htail_incidence = 0.0                // deg
htail_position = -15.0, 0.0, 0.8     // ft (aft of datum, on the tail cone)

vtail_area = 11.6                    // ft^2 (estimated from three-view)
vtail_span = 5.50                    // ft (fin height)
vtail_root_chord = 3.00              // ft
vtail_tip_chord = 1.40               // ft
vtail_quarter_chord_sweep = 20.0     // deg
vtail_dihedral = 0.0                 // deg
vtail_incidence = 0.0                // deg
vtail_position = -15.5, 0.0, -3.5    // ft (fin root on top of the fuselage)

elevator_area[0] = 7.1               // ft^2, right elevator
elevator_area[1] = 7.1               // ft^2, left elevator
aileron_area[0] = 5.9                // ft^2, right aileron
aileron_area[1] = 5.9                // ft^2, left aileron
rudder_area = 5.0                    // ft^2

// Empty inertia about the body axes; ESTIMATED from published empty
// weight and radii of gyration of the class (slug*ft^2).
empty_Ixx = 1269.0
empty_Iyy = 1813.0
empty_Izz = 2940.0

wheelbase = 9.2                      // ft, nose gear to main gear
wheel_track = 5.3                    // ft, main gear track

[WEIGHT_AND_BALANCE]
empty_weight_lb = 1685               // C172S typical equipped empty (POH)
max_gross_weight_lb = 2550           // MTOW (POH/type certificate)
empty_cg_arm_ft = 38.5               // ft aft of datum, ESTIMATED
cg_forward_mac_pct = 16.0            // % MAC, ESTIMATED envelope
cg_aft_mac_pct = 47.0                // % MAC, ESTIMATED envelope

[FUEL]
num_tanks = 2
tank_name[0] = left_wing
tank_name[1] = right_wing
tank_capacity_gal[0] = 28.5          // 57 gal total, 56 usable (POH)
tank_capacity_gal[1] = 28.5
tank_x_ft[0] = -1.5
tank_x_ft[1] = -1.5
tank_y_ft[0] = -6.5
tank_y_ft[1] = 6.5
tank_z_ft[0] = -0.4
tank_z_ft[1] = -0.4
tank_usable_frac[0] = 0.982          // 28.5 total -> 28.0 usable per side
tank_usable_frac[1] = 0.982

[PERFORMANCE]
vs0_kias = 40                       // flaps/gear extended (POH)
vs1_kias = 48                       // clean (POH)
vno_kias = 129                      // (POH)
vne_kias = 163                      // (POH)
va_kias = 85                        // maneuvering speed at MTOW (POH)
service_ceiling_ft = 14000           // (POH)
max_climb_rate_fpm = 730             // (POH, sea level, MTOW)
cruise_speed_ktas = 124              // 75 % power, 8000 ft, standard day (POH)

[AIRPLANE_FLIGHT_MODEL]
// Linear-region coefficients; the lift slope is consistent with the
// measured aspect ratio (~7.5): CL_alpha ~= 2*pi*AR/(AR+2) = 5.13 /rad.
zero_alpha_lift_coef = 0.15          // wing twist + incidence schedule effect
lift_slope_per_rad = 5.10            // ESTIMATED from AR
drag_coef_zero_lift = 0.032          // ESTIMATED (fuselage + parasite, clean)
oswald_efficiency = 0.78             // ESTIMATED for rectangular-ish wing
pitch_moment_zero_alpha = 0.030      // ESTIMATED, slightly nose-up at CL = 0
pitch_moment_slope = -0.85           // dCm/dalpha, statically stable (ESTIMATED)
pitch_damping = -12.5                // dCm/d(q*c/2V) (ESTIMATED)
elevator_pitch_power = -1.25         // dCm/dde per rad (ESTIMATED)
side_force_slope = -0.31             // dCy/dbeta (ESTIMATED)
roll_damping = -0.48                 // dCl/d(p*b/2V) (ESTIMATED)
roll_yaw_coupling = 0.12             // dCl/d(r*b/2V) (ESTIMATED)
aileron_roll_power = 0.17            // dCl/dda per rad (ESTIMATED)
dihedral_effect = -0.075             // dCl/dbeta (ESTIMATED, dihedral present)
yaw_damping = -0.14                  // dCn/d(r*b/2V) (ESTIMATED)
yaw_roll_coupling = 0.10             // dCn/d(p*b/2V) (ESTIMATED)
rudder_yaw_power = 0.09              // dCn ddr per rad (ESTIMATED)
directional_stability = 0.11         // dCn/dbeta, weathercock stable (ESTIMATED)
alpha_stall_deg = 16.0               // clean wing stall AOA (ESTIMATED)
post_stall_lift_factor = 0.45        // retained CL fraction beyond stall
// Flap deflection steps: 0 = first notch (TO), ... 30 deg full (LDG)
flap_cl[0] = 0.35                    // +CL at flaps 10 deg
flap_cl[1] = 0.65                    // +CL at flaps 20 deg
flap_cl[2] = 0.95                    // +CL at flaps 30 deg
flap_cd[0] = 0.010                   // +CD at flaps 10 deg
flap_cd[1] = 0.032                   // +CD at flaps 20 deg
flap_cd[2] = 0.070                   // +CD at flaps 30 deg
