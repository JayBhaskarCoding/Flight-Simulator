// ===========================================================================
// OpenMSFS clean-room reference aircraft: Cessna 172S Skyhawk — engines
// ---------------------------------------------------------------------------
// ORIGINAL clean-room file written from public data:
//  * Lycoming IO-360-L2A published ratings (180 hp @ 2700 RPM, 360 in^3)
//  * Cessna 172S POH operating limitations (2700 RPM redline, 100LL)
//  * McCauley 1A170 series public dimensions (76 in diameter, 3 blades)
// No proprietary Microsoft/Asobo configuration data is used.
// ===========================================================================

[PISTON_ENGINE]
fuel_type = 100LL
displacement_in3 = 360               // Lycoming IO-360-L2A, 4-cylinder
max_power_hp = 180                   // rated shaft power (published)
max_rpm = 2700                       // published redline
idle_rpm = 700                       // typical idle (published range 600-800)
bsfc_lb_per_hp_hr = 0.45             // typical Lyc AO-360 BSFC (ESTIMATED)
accessory_load_hp = 5                // vacuum pump, alternator, mag drives (ESTIMATED)
friction_torque_coeff = 1.8          // N*m per rad/s, viscous friction model (ESTIMATED)

[PROPELLER]
diameter_in = 76                     // McCauley 1A170E/JHA7660 class
inertia_slug_ft2 = 1.2               // ESTIMATED for a 76 in 3-blade prop
num_blades = 3
max_rpm = 2700                       // matches engine redline (fixed pitch)
constant_speed = 0                   // fixed-pitch propeller on the 172S
design_advance_ratio = 0.85          // cruise design point (ESTIMATED)
max_efficiency = 0.86                // peak prop efficiency (ESTIMATED)
geometric_pitch_in = 62              // cruise-pitch equivalent (ESTIMATED)
